name: Zed package

on:
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'core/**'
      - 'bindings/**'
      - 'plugins/**'
      - 'docs/**'
      - '.github/workflows/zpkg.yml'
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'LICENSE'
      - 'core/**'
      - 'bindings/**'
      - 'plugins/**'
      - 'docs/**'
      - '.github/workflows/zpkg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned together: zed-cli path-depends on the sibling zed-interfaces checkout.
  ZED_CLI_SHA: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
  ZED_INTERFACES_SHA: 415e871b1fb3dd97744c134351408a3224805dfb

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout syncer.c
        uses: actions/checkout@v4
        with:
          path: syncer.c

      - name: Checkout pinned zed-interfaces
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: zed-interfaces

      - name: Checkout pinned zed-cli
        uses: actions/checkout@v4
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: zed-cli

      - name: Build the audited Zed CLI
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml

      - name: Run the package's native smoke suite
        run: make -C syncer.c/core

      - name: Pack twice and prove byte-for-byte determinism
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/zed-cli/target/release/zed"
          one="$RUNNER_TEMP/zpkg-one"
          two="$RUNNER_TEMP/zpkg-two"
          mkdir -p "$one" "$two"

          (cd syncer.c && "$zed" pack --out "$one")
          (cd syncer.c && "$zed" pack --out "$two")

          archive='opto-sync-syncer-c-0.2.1.tar.gz'
          sha256sum "$one/$archive" "$two/$archive"
          cmp "$one/$archive" "$two/$archive"

      - name: Verify the source package boundary
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zpkg-one/opto-sync-syncer-c-0.2.1.tar.gz"
          listing="$RUNNER_TEMP/zpkg-files.txt"
          tar -tzf "$archive" | sort > "$listing"

          required=(
            'pkg/.zpkg.toml'
            'pkg/.zpkg.lock'
            'pkg/LICENSE'
            'pkg/README.md'
            'pkg/core/include/syncer.h'
            'pkg/core/src/syncer.c'
            'pkg/bindings/typescript/package.json'
            'pkg/bindings/wasm/package.json'
            'pkg/bindings/rust/Cargo.toml'
            'pkg/bindings/dart/pubspec.yaml'
            'pkg/bindings/go/go.mod'
            'pkg/bindings/beam/mix.exs'
            'pkg/bindings/gleam/gleam.toml'
          )
          for path in "${required[@]}"; do
            grep -Fqx "$path" "$listing" || {
              echo "::error title=missing package file::$path is absent from the Zed artifact"
              exit 1
            }
          done

          if grep -Eq '^pkg/(\.git|\.github|\.zed)(/|$)|/(node_modules|target|build|\.dart_tool)(/|$)' "$listing"; then
            echo '::error title=generated state leaked into package::Unexpected VCS, CI, cache, or build output in artifact'
            grep -E '^pkg/(\.git|\.github|\.zed)(/|$)|/(node_modules|target|build|\.dart_tool)(/|$)' "$listing"
            exit 1
          fi

      - name: Upload the audited artifact
        uses: actions/upload-artifact@v4
        with:
          name: opto-sync-syncer-c-zpkg
          path: ${{ runner.temp }}/zpkg-one/opto-sync-syncer-c-0.2.1.tar.gz
          if-no-files-found: error
          retention-days: 7
