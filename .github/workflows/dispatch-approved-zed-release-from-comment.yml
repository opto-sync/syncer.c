name: Dispatch approved Zed release from owner comment

on:
  pull_request:
    paths:
      - scripts/check-zed-release-dispatch-comment.py
      - scripts/test-zed-release-dispatch-comment.py
      - .github/workflows/dispatch-approved-zed-release-from-comment.yml
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: approved-zed-release-comment-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-contract:
    name: Adversarial owner-comment dispatch tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dispatcher change
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compile validators and run credential-free tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check-zed-release-dispatch-comment.py \
            scripts/test-zed-release-dispatch-comment.py \
            scripts/check-zed-publication-activation.py
          python3 scripts/test-zed-release-dispatch-comment.py -v
          python3 scripts/test-zed-publication-activation.py -v

      - name: Prove the dispatcher PR contains no release credential
        shell: bash
        run: |
          set -euo pipefail
          test -z "${ZED_PKG_TOKEN:-}"
          ! grep -R -nE 'ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+' \
            scripts/check-zed-release-dispatch-comment.py \
            scripts/test-zed-release-dispatch-comment.py \
            .github/workflows/dispatch-approved-zed-release-from-comment.yml

  dispatch:
    name: Validate merged activation and dispatch protected workflow
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 20 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'ORESoftware' &&
      github.event.comment.body == '/publish-approved-syncer-v0.2.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout only trusted main-branch controller code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch bounded merged-PR metadata without exposing response bodies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          base = os.environ['GITHUB_API_URL']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'opto-sync-approved-release-comment/1',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(resource):
              request = urllib.request.Request(base + resource, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f'GitHub API returned HTTP {exc.code} for {resource}'
                  ) from None

          pull = get(f'/repos/{repository}/pulls/20')
          files = []
          for page in range(1, 6):
              batch = get(
                  f'/repos/{repository}/pulls/20/files?per_page=100&page={page}'
              )
              if not isinstance(batch, list):
                  raise SystemExit('changed-files response was not an array')
              files.extend(item.get('filename') for item in batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit('activation PR exceeded five changed-file pages')
          if not all(isinstance(filename, str) and filename for filename in files):
              raise SystemExit('activation PR contains an invalid changed-file entry')

          with open('activation-pr.json', 'w', encoding='utf-8') as handle:
              json.dump(pull, handle, indent=2)
              handle.write('\n')
          with open('activation-pr-files.json', 'w', encoding='utf-8') as handle:
              json.dump(files, handle, indent=2)
              handle.write('\n')
          PY

      - name: Validate owner comment, merged PR, activation, approval, and workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-zed-release-dispatch-comment.py \
            --event "$GITHUB_EVENT_PATH" \
            --pull activation-pr.json \
            --files activation-pr-files.json \
            --output approved-release-dispatch-receipt.json
          python3 scripts/check-zed-publication-activation.py validate-contract \
            --approval release/zed-release-approval.v1.json \
            --activation release/zed-publication-activation.v1.json
          grep -F 'workflow_dispatch:' .github/workflows/approved-zed-release.yml
          grep -F 'publish:' .github/workflows/approved-zed-release.yml
          grep -F "environment: zed-production-release" \
            .github/workflows/approved-zed-release.yml

      - name: Dispatch the existing protected publication workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          resource = (
              f'/repos/{repository}/actions/workflows/'
              'approved-zed-release.yml/dispatches'
          )
          request = urllib.request.Request(
              os.environ['GITHUB_API_URL'] + resource,
              data=json.dumps(
                  {'ref': 'main', 'inputs': {'publish': 'true'}}
              ).encode(),
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'User-Agent': 'opto-sync-approved-release-comment/1',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f'GitHub API returned HTTP {exc.code} for workflow dispatch'
              ) from None
          if status != 204:
              raise SystemExit(f'unexpected workflow dispatch status: {status}')
          PY

      - name: Upload the bounded dispatch receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-zed-release-dispatch-receipt
          path: approved-release-dispatch-receipt.json
          if-no-files-found: error
          retention-days: 30
