name: Formal methods

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-methods-${{ github.ref }}
  cancel-in-progress: true

jobs:
  procedure-contract:
    name: Procedure manifest and bounded specification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check proof inventory and bounded algebra
        run: python3 formal/procedure_model.py
      - name: Check JSON-lines formal adapter
        run: |
          printf '%s\n' \
            '{"op":"compare","left":"009","right":"9"}' \
            '{"op":"strategy_valid","value":5}' \
            | python3 formal/procedure_model.py --json-stdin

  c-cbmc:
    name: CBMC production C proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Prove C timestamp ordering and FFI guard
        run: nix develop --command bash scripts/formal-check.sh c

  rust-kani:
    name: Kani Rust FFI boundary proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install pinned Kani verifier
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Prove Rust/C ABI and FFI preconditions
        working-directory: bindings/rust
        run: cargo kani
